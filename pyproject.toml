[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pdf-local"
version = "0.1.0"
description = "Pipeline RAG 100% local: PDF -> banco vetorial -> consulta via LLM no LM Studio"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "langchain-text-splitters>=0.2.0",
    "chromadb>=0.5.0",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
app = [
    "streamlit>=1.35.0",
]

[project.scripts]
rag-pdf = "rag_pdf.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pdf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
